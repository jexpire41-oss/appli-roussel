<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu de Mémoire - Fleurs</title>
  <!-- Inclusion de Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<!-- Container principal (Mobile First : max-w-[375px]) -->
<main class="w-full max-w-[375px] bg-white rounded-xl shadow-lg p-5 text-center">

  <header class="mb-4">
    <h1 class="text-2xl font-bold text-slate-800">Memory Fleurs</h1>
    <p class="text-slate-600 font-medium mt-1">
      Coups : <span id="score" class="text-emerald-600 font-bold">0</span>
    </p>
  </header>

  <!-- Grille de 16 cartes (4x4) -->
  <div id="grid" class="grid grid-cols-4 gap-2 mb-4"></div>

  <!-- Encadré pour l'anecdote -->
  <div id="anecdote-box" class="hidden text-left p-3 bg-emerald-50 border-l-4 border-emerald-500 rounded text-sm text-slate-700 mb-4 transition-all"></div>

  <!-- Bouton Rejouer -->
  <button id="restart-btn" class="hidden w-full py-2 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow transition duration-200">
    Rejouer
  </button>

</main>

<script src="app.js"></script>
</body>
</html>
