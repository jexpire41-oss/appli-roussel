<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Fleurs Roussel</title>
  <!-- Feuille de style Tailwind compilée depuis src/input.css -->
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-roussel-vert-clair text-roussel-texte min-h-screen flex items-center justify-center p-4">

<!-- Conteneur principal (Mobile First : max-w-[375px]) -->
<main class="w-full max-w-[375px] bg-white rounded-xl shadow-lg p-5 text-center border border-roussel-vert/15">

  <header class="mb-4">
    <h1 class="text-2xl font-bold text-roussel-vert">Memory Fleurs Roussel</h1>
    <p class="text-roussel-gris font-medium mt-1">
      Coups : <span id="score" class="text-roussel-rose font-bold">0</span>
    </p>
  </header>

  <!-- Grille de 16 cartes (4x4) -->
  <div id="grid" class="grid grid-cols-4 gap-2 mb-4"></div>

  <!-- Encadré pour l'anecdote botanique -->
  <div id="anecdote-box" class="hidden text-left p-3 bg-roussel-vert-clair border-l-4 border-roussel-vert rounded text-sm text-roussel-texte mb-4 transition-all"></div>

  <!-- Bouton Rejouer -->
  <button id="restart-btn" type="button" class="hidden w-full py-2 px-4 bg-roussel-rose hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-roussel-rose text-white font-semibold rounded-lg shadow transition duration-200 cursor-pointer">
    Rejouer
  </button>

</main>

<script src="js/app.js"></script>
</body>
</html>
